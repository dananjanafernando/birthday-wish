<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
      background-size:400% 400%;
      animation:bgMove 10s infinite alternate;
      flex-direction:column;
    }

    @keyframes bgMove{
      0%{background-position:left;}
      100%{background-position:right;}
    }

    .card{
      text-align:center;
      padding:40px;
      border-radius:25px;
      background:rgba(255,255,255,0.15);
      backdrop-filter:blur(10px);
      box-shadow:0 8px 30px rgba(0,0,0,0.2);
      animation:zoomIn 2s ease;
    }

    @keyframes zoomIn{
      from{
        transform:scale(0.5);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    h1{
      font-size:60px;
      color:white;
      animation:glow 2s infinite alternate;
    }

    p{
      margin-top:20px;
      font-size:24px;
      color:white;
    }

    @keyframes glow{
      from{
        text-shadow:0 0 10px #fff,0 0 20px #ff4da6;
      }
      to{
        text-shadow:0 0 20px #fff,0 0 40px #ff1493;
      }
    }

    button{
      margin-top:25px;
      padding:15px 30px;
      border:none;
      border-radius:15px;
      font-size:20px;
      cursor:pointer;
    }

    .balloon{
      position:absolute;
      bottom:-150px;
      width:80px;
      animation:float 8s infinite;
    }

    .balloon:nth-child(1){
      left:10%;
      animation-duration:7s;
    }

    .balloon:nth-child(2){
      left:40%;
      animation-duration:9s;
    }

    .balloon:nth-child(3){
      left:70%;
      animation-duration:6s;
    }

    @keyframes float{
      0%{
        transform:translateY(0);
      }
      100%{
        transform:translateY(-120vh);
      }
    }

  </style>
</head>

<body>

  <img class="balloon" src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png">
  <img class="balloon" src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png">
  <img class="balloon" src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png">

  <div class="card">
    <h1>🎉 Happy Birthday 🎂</h1>
    <p>Wishing You Happiness, Joy & Success!</p>
    <p>🌟 Have an Amazing Day 🌟</p>

    <button onclick="playMusic()">▶ Play Music</button>
  </div>

  <audio id="song">
    <source src="https://files.catbox.moe/sav8jr.mp3" type="audio/mp3">
  </audio>

  <script>
    function playMusic(){
      document.getElementById("song").play();
    }
  </script>

</body>
</html>
